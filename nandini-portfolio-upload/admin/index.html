<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Portfolio Editor</title><style>body{font-family:Arial,sans-serif;margin:0;background:#f4f1eb;color:#202421}.wrap{max-width:920px;margin:auto;padding:35px 20px}h1{font-family:Georgia,serif;font-size:42px}section{background:#fff;padding:25px;margin:18px 0;border:1px solid #ddd}label{display:block;font-size:12px;font-weight:bold;text-transform:uppercase;letter-spacing:.08em;margin:16px 0 6px}input,textarea{width:100%;padding:12px;border:1px solid #bbb;box-sizing:border-box;font:inherit}textarea{min-height:100px}button,a.btn{padding:13px 18px;border:1px solid #202421;background:#202421;color:white;text-decoration:none;display:inline-block;margin:8px 8px 0 0}.secondary{background:white!important;color:#202421!important}.note{background:#fff6d8;border:1px solid #e6d18b;padding:15px;line-height:1.5}.grid{display:grid;grid-template-columns:1fr 1fr;gap:15px}@media(max-width:650px){.grid{grid-template-columns:1fr}}</style></head><body><div class="wrap"><a href="/">← Back to website</a><h1>Portfolio Editor</h1><p class="note"><b>No password required.</b> Changes saved here appear on this browser and device. Use <b>Download website data</b> as a backup. To publish edits permanently for every visitor, replace the JSON files inside <code>content/</code> and redeploy the site.</p><form id="editor"><section><h2>Profile</h2><div class="grid"><div><label>Name</label><input name="name"></div><div><label>Location</label><input name="location"></div></div><label>Hero title</label><textarea name="heroTitle"></textarea><label>Hero introduction</label><textarea name="heroText"></textarea><label>About</label><textarea name="aboutText"></textarea><div class="grid"><div><label>Email</label><input name="email"></div><div><label>Phone</label><input name="phone"></div></div></section><section><h2>Featured project</h2><div class="grid"><div><label>Project title</label><input name="p_title"></div><div><label>Subtitle</label><input name="p_subtitle"></div><div><label>Status</label><input name="p_status"></div><div><label>Location</label><input name="p_location"></div></div><label>Summary</label><textarea name="p_summary"></textarea><label>Brief</label><textarea name="p_brief"></textarea><label>Concept</label><textarea name="p_concept"></textarea><label>Scope (one item per line)</label><textarea name="p_scope"></textarea><label>Materials (one item per line)</label><textarea name="p_materials"></textarea></section><button type="submit">Save preview</button><button type="button" class="secondary" id="download">Download website data</button><button type="button" class="secondary" id="reset">Reset local edits</button></form></div><script>let site,project;const f=document.getElementById('editor');async function init(){site=await(await fetch('/content/site.json')).json();project=await(await fetch('/content/project.json')).json();try{site={...site,...JSON.parse(localStorage.getItem('nk-site')||'{}')};project={...project,...JSON.parse(localStorage.getItem('nk-project')||'{}')}}catch{};for(const k of ['name','location','heroTitle','heroText','aboutText','email','phone'])f[k].value=site[k]||'';for(const k of ['title','subtitle','status','location','summary','brief','concept'])f['p_'+k].value=project[k]||'';f.p_scope.value=(project.scope||[]).join('
');f.p_materials.value=(project.materials||[]).join('
')}f.onsubmit=e=>{e.preventDefault();for(const k of ['name','location','heroTitle','heroText','aboutText','email','phone'])site[k]=f[k].value;for(const k of ['title','subtitle','status','location','summary','brief','concept'])project[k]=f['p_'+k].value;project.scope=f.p_scope.value.split('
').filter(Boolean);project.materials=f.p_materials.value.split('
').filter(Boolean);localStorage.setItem('nk-site',JSON.stringify(site));localStorage.setItem('nk-project',JSON.stringify(project));alert('Saved. Open the website on this device to preview your changes.')};document.getElementById('reset').onclick=()=>{localStorage.removeItem('nk-site');localStorage.removeItem('nk-project');location.reload()};document.getElementById('download').onclick=()=>{const blob=new Blob([JSON.stringify({site,project},null,2)],{type:'application/json'}),a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='nandini-portfolio-data.json';a.click()};init();</script></body></html>
