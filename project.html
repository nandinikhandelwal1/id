<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>2 BHK Residential Home — Nandini Khandelwal</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=DM+Mono:wght@400;500&family=Manrope:wght@400;500;600;700&family=Playfair+Display:ital,wght@0,500;0,600;1,500;1,600&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="styles.css" />
  <style>
    .project-page{padding:clamp(7rem,13vw,11rem) 5vw 5rem}.project-page .eyebrow{margin-bottom:1.5rem}.project-heading{max-width:900px;font-size:clamp(3.5rem,9vw,8rem);line-height:.9;margin:0 0 2rem}.project-heading em{font-weight:500}.project-intro{display:flex;justify-content:space-between;gap:3rem;max-width:1000px;margin-bottom:4rem}.project-intro p{max-width:430px;color:#6d685f}.viewer-shell{background:#e7e2d9;padding:clamp(.75rem,2vw,2rem)}model-viewer{display:block;width:100%;height:min(72vh,760px);background:linear-gradient(135deg,#e9e4dc,#d8d1c6);--poster-color:transparent}.viewer-note{display:flex;justify-content:space-between;gap:1rem;padding:1rem 0 0;color:#6d685f;font:12px 'DM Mono',monospace;text-transform:uppercase;letter-spacing:.08em}.back-link{display:inline-block;margin-top:2.5rem;color:inherit;text-decoration:none;border-bottom:1px solid currentColor;padding-bottom:.25rem}@media(max-width:700px){.project-intro{display:block}.viewer-note{display:block;line-height:1.7}}
  </style>
  <script type="module" src="https://unpkg.com/@google/model-viewer@4.0.0/dist/model-viewer.min.js"></script>
</head>
<body>
  <header class="site-header"><a class="wordmark" href="index.html">NK<span>®</span></a><nav class="nav"><a href="index.html#about">About</a><a href="index.html#work">Selected work</a><a href="index.html#contact">Contact</a></nav><button class="menu-button" aria-label="Toggle menu"><span></span><span></span></button></header>
  <main class="project-page">
    <p class="eyebrow">01 — Interactive project</p>
    <h1 class="project-heading">2 BHK<br /><em>Residential Home</em></h1>
    <div class="project-intro"><p>College project · Complete 3D model</p><p>Explore the space by dragging to orbit, scrolling to zoom and using the controls below.</p></div>
    <section class="viewer-shell" aria-label="Interactive 3D model viewer">
      <model-viewer src="assets/final-model-web.glb" camera-controls auto-rotate shadow-intensity="1" exposure="1" environment-image="neutral" interaction-prompt="auto" alt="Interactive 3D model of a 2 BHK residential home"><div slot="progress-bar" style="width:100%;height:3px;background:#bca484"></div></model-viewer>
      <div class="viewer-note"><span>Drag to orbit · Scroll to zoom</span><span>Academic project · 2026</span></div>
    </section>
    <a class="back-link" href="index.html#work">← Back to selected work</a>
  </main>
  <script>document.querySelector('.menu-button').addEventListener('click',()=>document.querySelector('.nav').classList.toggle('open'));</script>
</body>
</html>
