<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Nandini — Live Site Editor</title><style>*{box-sizing:border-box}body{margin:0;background:#24221f;color:#fff;font:13px Arial}.toolbar{position:fixed;z-index:20;top:16px;left:50%;transform:translateX(-50%);display:flex;gap:8px;padding:8px;background:#fff;color:#24221f;box-shadow:0 8px 30px #0005}.toolbar button{background:#24221f;color:#fff;border:0;padding:10px 14px;cursor:pointer}.toolbar button.secondary{background:#eee;color:#24221f}.hint{position:fixed;z-index:19;right:20px;bottom:20px;padding:12px 15px;background:#fff;color:#24221f;box-shadow:0 8px 30px #0004}.frame{height:100vh;padding:0 18px;overflow:auto}.site{max-width:1440px;margin:auto;background:#f4f1eb;min-height:100vh}.editable{outline:2px dashed transparent;outline-offset:4px;cursor:text}.editable:hover,.editable:focus{outline-color:#c29f79}.image-edit{outline:3px dashed transparent;outline-offset:5px;cursor:pointer}.image-edit:hover{outline-color:#c29f79}.section-edit{position:relative}.section-edit:hover:before{content:'Drag section';position:absolute;top:8px;left:8px;z-index:3;padding:5px 8px;background:#24221f;color:#fff;font:10px Arial;text-transform:uppercase;letter-spacing:.1em}.drop-line{height:10px;background:#c29f79;display:none}.dragging{opacity:.4}</style></head><body><div class="toolbar"><button id="back">← Website</button><button id="add">＋ Add section</button><button id="save">Save draft</button><button id="export" class="secondary">Export changes</button><button id="reset" class="secondary">Reset</button><input id="file" type="file" accept="image/*" hidden></div><div class="hint">Click text to edit · Click an image to replace · Drag sections to reorder</div><div class="frame"><iframe class="site" id="site" src="../" title="Live website preview"></iframe></div><script>const frame=document.querySelector('#site'),storage='nk-live-site-html';let doc;frame.onload=()=>{doc=frame.contentDocument;const saved=localStorage.getItem(storage);if(saved)doc.body.innerHTML=saved;wire()};function wire(){[...doc.querySelectorAll('h1,h2,h3,p,a,span,dt,dd')].forEach(el=>{el.contentEditable='true';el.classList.add('editable');el.addEventListener('click',e=>{e.preventDefault();e.stopPropagation()})});[...doc.querySelectorAll('img')].forEach(img=>{img.classList.add('image-edit');img.onclick=e=>{e.preventDefault();e.stopPropagation();activeImage=img;document.querySelector('#file').click()}});[...doc.querySelectorAll('section,article,footer')].forEach(section=>{section.draggable=true;section.classList.add('section-edit');section.ondragstart=()=>{moving=section;section.classList.add('dragging')};section.ondragend=()=>{section.classList.remove('dragging');moving=null};section.ondragover=e=>e.preventDefault();section.ondrop=e=>{e.preventDefault();if(moving&&moving!==section)section.parentNode.insertBefore(moving,section);}})}let activeImage=null,moving=null;document.querySelector('#file').onchange=e=>{const file=e.target.files[0];if(!file||!activeImage)return;const reader=new FileReader;reader.onload=()=>{activeImage.src=reader.result;activeImage=null};reader.readAsDataURL(file)};document.querySelector('#save').onclick=()=>{localStorage.setItem(storage,doc.body.innerHTML);alert('Live draft saved on this browser.')};document.querySelector('#export').onclick=()=>{const blob=new Blob(['<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Nandini Khandelwal</title></head><body>'+doc.body.innerHTML+'</body></html>'],{type:'text/html'}),a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='nandini-live-page.html';a.click()};document.querySelector('#reset').onclick=()=>{localStorage.removeItem(storage);location.reload()};document.querySelector('#back').onclick=()=>location.href='../';document.querySelector('#add').onclick=()=>{const section=doc.createElement('section');section.style.cssText='padding:120px 9vw;background:#ded7cc';section.innerHTML='<h2>New section</h2><p>Click this text to edit your new section.</p>';doc.querySelector('main')?.append(section)||doc.body.append(section);wire()};</script></body></html>
