<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Nandini — Visual Editor</title><style>:root{--ink:#24221f;--paper:#f4f1eb;--panel:#fff;--line:#d8d2c8;--accent:#9b8367}*{box-sizing:border-box}body{margin:0;background:var(--paper);color:var(--ink);font:13px/1.5 Arial,sans-serif}.top{height:70px;padding:0 28px;border-bottom:1px solid var(--line);display:flex;align-items:center;justify-content:space-between;background:#fbfaf7;position:sticky;top:0;z-index:10}.brand{font:24px Georgia,serif}.top-actions{display:flex;gap:10px}button,.button{border:1px solid var(--ink);background:var(--ink);color:#fff;padding:11px 15px;cursor:pointer;font:12px Arial}.secondary{background:transparent;color:var(--ink)}main{display:grid;grid-template-columns:275px minmax(420px,720px) 300px;gap:22px;max-width:1500px;margin:0 auto;padding:28px}.sidebar,.inspector,.canvas{background:var(--panel);border:1px solid var(--line)}.sidebar,.inspector{padding:22px}.sidebar h2,.inspector h2{font:24px Georgia,serif;margin:0 0 24px}.hint{color:#776f66;font-size:12px;margin-bottom:20px}.palette{display:grid;gap:9px}.block-button{background:#f7f4ee;color:var(--ink);border:1px solid var(--line);text-align:left}.block-button:hover{border-color:var(--accent);background:#eee8df}.canvas{padding:24px;min-height:75vh;background:#e9e4dc}.canvas-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:15px;color:#776f66;font-size:11px;text-transform:uppercase;letter-spacing:.1em}.dropzone{min-height:100px}.block{background:#fff;border:1px solid var(--line);margin-bottom:12px;position:relative;transition:.15s}.block.dragging{opacity:.35}.block.selected{border:2px solid var(--accent)}.block-bar{height:34px;padding:8px 11px;background:#fbfaf7;border-bottom:1px solid var(--line);display:flex;justify-content:space-between;font-size:11px;color:#776f66}.block-bar span:first-child{cursor:grab}.block-body{padding:22px}.block h1,.block h2,.block h3,.block p{margin:0}.block h1{font:38px Georgia,serif;line-height:1.05}.block h2{font:30px Georgia,serif}.block h3{font:22px Georgia,serif}.block p{color:#776f66;margin-top:10px}.image-preview{width:100%;max-height:300px;object-fit:cover;display:block}.empty{text-align:center;padding:80px 20px;color:#776f66;border:1px dashed #aaa}.field{display:grid;gap:6px;margin-bottom:16px}.field label{font-size:10px;text-transform:uppercase;letter-spacing:.12em;color:#776f66}.field input,.field textarea,.field select{border:1px solid var(--line);padding:10px;background:#fff;font:inherit;width:100%}.field textarea{min-height:100px;resize:vertical}.muted{color:#776f66;font-size:12px}.danger{background:#fff;color:#9a3b32;border-color:#c98f89}.row{display:flex;gap:8px}.row>*{flex:1}.image-upload{display:block;border:1px dashed #aaa;padding:18px;text-align:center;color:#776f66;cursor:pointer}.image-upload input{display:none}.toast{position:fixed;bottom:22px;right:22px;background:var(--ink);color:#fff;padding:12px 16px;display:none}@media(max-width:1000px){main{grid-template-columns:220px 1fr}.inspector{grid-column:1/-1}.inspector-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:15px}}@media(max-width:650px){.top{padding:0 15px}.top-actions button:nth-child(1){display:none}main{display:block;padding:12px}.sidebar,.canvas,.inspector{margin-bottom:12px}.canvas{min-height:400px}.inspector-grid{display:block}}
</style></head><body><header class="top"><div class="brand">Nandini / Editor</div><div class="top-actions"><button class="secondary" id="preview">Preview website</button><button id="save">Save draft</button><button id="export">Export content</button></div></header><main><aside class="sidebar"><h2>Blocks</h2><p class="hint">Drag blocks into the page, or click to add them. Select a block to edit it.</p><div class="palette"><button class="block-button" data-add="hero">＋ Hero section</button><button class="block-button" data-add="text">＋ Text section</button><button class="block-button" data-add="image">＋ Image</button><button class="block-button" data-add="gallery">＋ Image gallery</button><button class="block-button" data-add="project">＋ Project</button><button class="block-button" data-add="services">＋ Services</button><button class="block-button" data-add="contact">＋ Contact</button><button class="block-button" data-add="spacer">＋ Spacer</button></div><hr><p class="hint">Tip: drag the handle on any section to reorder it.</p></aside><section class="canvas"><div class="canvas-head"><span>Page layout</span><span id="count"></span></div><div id="dropzone" class="dropzone"></div></section><aside class="inspector"><h2>Inspector</h2><div id="inspector" class="muted">Select a block to edit its content.</div></aside></main><div id="toast" class="toast"></div><script>
const key='nk-builder-v1';const starter=[{type:'hero',title:'Rooms that remember you.',text:'Interior architecture shaped by light, material and the rituals of everyday life.'},{type:'text',title:'The quiet language of home.',text:'Thoughtful spaces with a point of view — warm, tactile and deeply personal.'},{type:'project',title:'2 BHK Residential Home for a Celebrity',text:'Complete 3D model · Render gallery coming soon.'},{type:'contact',title:'Have a space in mind?',text:'nknandinik10@gmail.com · +91 8979933462'}];const stored=JSON.parse(localStorage.getItem(key)||'null');let blocks=Array.isArray(stored)&&stored.length?stored:starter;let selected=-1,dragged=-1;const zone=document.querySelector('#dropzone'),inspector=document.querySelector('#inspector');
const defaults={hero:{title:'A new hero section',text:'Add a short introduction.'},text:{title:'Section heading',text:'Write your story here.'},image:{title:'Image',src:''},gallery:{title:'Gallery',images:[]},project:{title:'Project title',text:'Project description.'},services:{title:'Services',text:'Residential interiors · Space planning · Furniture design'},contact:{title:'Contact',text:'Email · Phone · Social links'},spacer:{title:'Spacer'}};
function add(type){blocks.push({...defaults[type],type});selected=blocks.length-1;render();notify('Block added');}document.querySelectorAll('[data-add]').forEach(b=>b.onclick=()=>add(b.dataset.add));
function render(){zone.innerHTML='';document.querySelector('#count').textContent=blocks.length+' blocks';if(!blocks.length){zone.innerHTML='<div class="empty">Add your first block from the left panel.</div>';return}blocks.forEach((b,i)=>{const el=document.createElement('article');el.className='block'+(i===selected?' selected':'');el.draggable=true;el.dataset.index=i;el.onclick=e=>{if(!e.target.closest('.block-bar button')){selected=i;render()}};el.ondragstart=()=>{dragged=i;el.classList.add('dragging')};el.ondragend=()=>el.classList.remove('dragging');el.ondragover=e=>e.preventDefault();el.ondrop=e=>{e.preventDefault();if(dragged===i)return;const moved=blocks.splice(dragged,1)[0];blocks.splice(i,0,moved);selected=i;render()};el.innerHTML='<div class="block-bar"><span>⠿ '+b.type.toUpperCase()+'</span><span><button class="secondary" data-duplicate>Duplicate</button> <button class="secondary" data-delete>Delete</button></span></div><div class="block-body">'+body(b)+'</div>';el.querySelector('[data-duplicate]').onclick=()=>{blocks.splice(i,0,{...b,images:b.images?[...b.images]:undefined});selected=i+1;render()};el.querySelector('[data-delete]').onclick=()=>{blocks.splice(i,1);selected=-1;render()};zone.appendChild(el)};renderInspector()}
function body(b){if(b.type==='spacer')return '<div style="height:80px;background:#f5f1ea"></div>';if(b.type==='image')return b.src?'<img class="image-preview" src="'+b.src+'">':'<div class="empty">Image block — upload an image in the inspector</div>';if(b.type==='gallery')return b.images?.length?'<div style="display:grid;grid-template-columns:repeat(3,1fr);gap:7px">'+b.images.map(x=>'<img class="image-preview" src="'+x+'">').join('')+'</div>':'<div class="empty">Gallery block — upload images in the inspector</div>';return '<p class="eyebrow">'+b.type+'</p><h'+(b.type==='hero'||b.type==='project'?'1':'2')+'>'+esc(b.title||'')+'</h'+(b.type==='hero'||b.type==='project'?'1':'2')+'><p>'+esc(b.text||'')+'</p>'}function esc(x){return String(x).replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]))}
function renderInspector(){if(selected<0||!blocks[selected]){inspector.innerHTML='<p class="muted">Select a block to edit its content.</p>';return}const b=blocks[selected];inspector.innerHTML='<p class="muted">Editing '+b.type+' block</p><div class="inspector-grid"><div class="field"><label>Block type</label><input value="'+b.type+'" disabled></div><div class="field"><label>Heading</label><input id="edit-title" value="'+esc(b.title||'')+'"></div><div class="field"><label>Text</label><textarea id="edit-text">'+esc(b.text||'')+'</textarea></div></div>'+(b.type==='image'||b.type==='gallery'?'<label class="image-upload">＋ Upload '+(b.type==='gallery'?'images':'image')+'<input id="upload" type="file" accept="image/*" '+(b.type==='gallery'?'multiple':'')+'></label>':'')+'<button class="danger" id="remove">Delete this block</button>';document.querySelector('#edit-title').oninput=e=>{b.title=e.target.value;render()};document.querySelector('#edit-text').oninput=e=>{b.text=e.target.value;render()};document.querySelector('#remove').onclick=()=>{blocks.splice(selected,1);selected=-1;render()};const up=document.querySelector('#upload');if(up)up.onchange=async e=>{const files=[...e.target.files];const urls=await Promise.all(files.map(file=>new Promise(res=>{const r=new FileReader();r.onload=()=>res(r.result);r.readAsDataURL(file)})));if(b.type==='gallery')b.images=[...(b.images||[]),...urls];else b.src=urls[0];render();notify('Image added')};}
function notify(t){const el=document.querySelector('#toast');el.textContent=t;el.style.display='block';setTimeout(()=>el.style.display='none',1600)}document.querySelector('#save').onclick=()=>{localStorage.setItem(key,JSON.stringify(blocks));notify('Draft saved on this device')};document.querySelector('#export').onclick=()=>{const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([JSON.stringify(blocks,null,2)],{type:'application/json'}));a.download='nandini-page-blocks.json';a.click();notify('Content exported')};document.querySelector('#preview').onclick=()=>{const html='<!doctype html><html><head><meta name="viewport" content="width=device-width,initial-scale=1"><title>Nandini — Live Preview</title><style>body{margin:0;background:#f4f1eb;color:#24221f;font:16px Arial;line-height:1.6}.section{padding:10vh 9vw;border-bottom:1px solid #d8d2c8}.hero{min-height:55vh;background:#24221f;color:#f4f1eb;display:flex;flex-direction:column;justify-content:center}.hero h1,h1,h2{font:clamp(38px,7vw,88px)/1 Georgia;margin:12px 0}.project h1{font-size:48px}p{max-width:620px;color:#776f66}.hero p{color:#d8d2c8}img{max-width:100%;max-height:480px;object-fit:cover}.gallery{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}.gallery img{width:100%;height:220px}a{color:inherit}</style></head><body>'+blocks.map(b=>{if(b.type==='spacer')return '<div style="height:80px"></div>';if(b.type==='image')return '<section class="section"><h2>'+esc(b.title)+'</h2>'+(b.src?'<img src="'+b.src+'">':'')+'</section>';if(b.type==='gallery')return '<section class="section"><h2>'+esc(b.title)+'</h2><div class="gallery">'+(b.images||[]).map(x=>'<img src="'+x+'">').join('')+'</div></section>';return '<section class="section '+(b.type==='hero'?'hero':'')+'"><small>'+b.type.toUpperCase()+'</small><h1>'+esc(b.title||'')+'</h1><p>'+esc(b.text||'')+'</p></section>'}).join('')+'</body></html>';const w=window.open();w.document.write(html);w.document.close()};render();
</script></body></html>
